<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Canvas 课程助手</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header class="app-header">
  <div class="app-title" data-i18n="app.title"></div>
  <div class="header-right">
    <div class="range-pill" id="rangePill"></div>
    <button id="btnLang" class="lang-btn" data-i18n-aria="lang.switch"></button>
    <button id="btnSettings" class="btn btn-ghost" data-i18n="btn.settings"></button>
  </div>
</header>

<main>
  <section class="card">
    <div class="card-head">
      <span class="eyebrow" data-i18n="sync.eyebrow"></span>
      <h2 data-i18n="sync.heading"></h2>
    </div>
    <div class="row">
      <label class="field"><span data-i18n="sync.start"></span><input id="inpStart" type="date"></label>
      <label class="field"><span data-i18n="sync.end"></span><input id="inpEnd" type="date"></label>
      <button id="btnLoadCourses" class="btn btn-ghost" data-i18n="btn.load_courses"></button>
      <button id="btnSync" class="btn btn-primary" data-i18n="btn.sync"></button>
    </div>
    <div id="courseCheckboxes" class="chips"></div>
  </section>

  <section class="card">
    <div class="tabs" role="tablist">
      <button class="tab active" data-target="tabAnnounce" role="tab" aria-selected="true" data-i18n="tab.announce"></button>
      <button class="tab" data-target="tabFiles" role="tab" aria-selected="false" data-i18n="tab.files"></button>
      <button class="tab" data-target="tabSchedule" role="tab" aria-selected="false" data-i18n="tab.schedule"></button>
      <button class="tab" data-target="tabTodo" role="tab" aria-selected="false" data-i18n="tab.todo"></button>
      <button class="tab" data-target="tabGrades" role="tab" aria-selected="false" data-i18n="tab.grades"></button>
    </div>

    <div id="tabAnnounce" class="tab-panel" role="tabpanel">
      <div class="filter-bar">
        <span class="filter-label" data-i18n="announce.filter.label"></span>
        <label class="check"><input type="checkbox" id="chkShowAll"> <span data-i18n="announce.filter.show_all"></span></label>
        <label class="field"><span data-i18n="announce.filter.from"></span><input id="filterStart" type="date"></label>
        <label class="field"><span data-i18n="announce.filter.to"></span><input id="filterEnd" type="date"></label>
        <label class="field"><span data-i18n="announce.filter.course"></span><select id="selAnnounceCourse"></select></label>
      </div>
      <div id="summaries"></div>
      <div class="write-bar">
        <button id="btnWriteCalendar" class="btn btn-accent" data-i18n="btn.write_calendar"></button>
        <label class="field"><span data-i18n="announce.alert"></span><select id="selAlert"></select></label>
        <button id="btnWriteReminders" class="btn btn-accent" data-i18n="btn.write_reminders"></button>
      </div>
    </div>

    <div id="tabFiles" class="tab-panel" role="tabpanel" hidden>
      <div class="row">
        <button id="btnListFiles" class="btn btn-primary" data-i18n="btn.list_files"></button>
        <label class="field"><span data-i18n="files.type_filter"></span><input id="inpTypeFilter" type="text" data-i18n-ph="files.placeholder"></label>
        <label class="field"><span data-i18n="files.filter.course"></span><select id="selFileCourse"></select></label>
        <button id="btnSelectAllFiles" class="btn btn-ghost" data-i18n="btn.select_all"></button>
        <button id="btnDownloadFiles" class="btn btn-primary" data-i18n="btn.download"></button>
      </div>
      <div id="downloadProgress" class="download-progress" hidden>
        <div class="progress-track"><div class="progress-fill" id="downloadProgressFill"></div></div>
        <div class="progress-text" id="downloadProgressText"></div>
      </div>
      <div id="filesArea" class="muted" style="margin-top:14px"></div>
    </div>

    <div id="tabSchedule" class="tab-panel" role="tabpanel" hidden>
      <div class="filter-bar" id="banwebStatus">
        <span class="filter-label" data-i18n="schedule.login_label"></span>
        <span id="banwebStatusText" class="muted"></span>
        <button id="btnBanwebLogin" class="btn btn-primary" hidden data-i18n="btn.relogin"></button>
      </div>
      <div class="row" style="margin-bottom:16px">
        <label class="field"><span data-i18n="schedule.term"></span><select id="selTerm"></select></label>
        <button id="btnFetchSchedule" class="btn btn-primary" data-i18n="btn.fetch"></button>
      </div>
      <div class="filter-bar" id="scheduleFilters" style="margin-top:-4px">
        <button id="btnLoadAssignments" class="btn btn-ghost" data-i18n="btn.load_assignments"></button>
        <label class="field"><span data-i18n="schedule.professor"></span><select id="selProfessor"></select></label>
      </div>
      <div class="week-nav" id="weekNav">
        <button id="btnWeekPrev" class="btn btn-ghost" data-i18n-aria="week.prev" aria-label="上一周">◀</button>
        <span id="weekRange" class="week-range"></span>
        <button id="btnWeekNext" class="btn btn-ghost" data-i18n-aria="week.next" aria-label="下一周">▶</button>
        <button id="btnWeekToday" class="btn btn-ghost" data-i18n="week.today"></button>
      </div>
      <div id="schedulePreview"></div>
      <div id="scheduleNoFixed"></div>
      <div class="write-bar">
        <label class="field"><span data-i18n="schedule.calendar"></span><select id="selSchedCalendar"></select></label>
        <label class="field"><span data-i18n="schedule.alert"></span><select id="selSchedAlert"></select></label>
        <button id="btnWriteSchedule" class="btn btn-accent" data-i18n="btn.sync_schedule"></button>
        <button id="btnClearSchedule" class="btn btn-ghost" data-i18n="btn.clear"></button>
      </div>
    </div>

    <div id="tabTodo" class="tab-panel" role="tabpanel" hidden>
      <div class="filter-bar" id="todoStatus">
        <span class="filter-label" data-i18n="todo.groups_label"></span>
        <button id="btnLoadTodo" class="btn btn-primary" data-i18n="btn.load_todo"></button>
      </div>
      <div id="todoGroups"></div>
      <div class="sub-label" style="margin-top:18px" data-i18n="todo.events_heading"></div>
      <div id="todoEvents" class="muted" style="margin-top:4px"></div>
      <div class="write-bar">
        <label class="field"><span data-i18n="schedule.calendar"></span><select id="selTodoCalendar"></select></label>
        <label class="field"><span data-i18n="schedule.alert"></span><select id="selTodoAlert"></select></label>
        <button id="btnWriteTodoEvents" class="btn btn-accent" data-i18n="todo.write_events"></button>
      </div>
    </div>

    <div id="tabGrades" class="tab-panel" role="tabpanel" hidden>
      <div class="filter-bar" id="gradesStatus">
        <span class="filter-label" data-i18n="grades.label"></span>
        <button id="btnLoadGrades" class="btn btn-primary" data-i18n="btn.load_grades"></button>
      </div>
      <div id="gradesArea"></div>
    </div>
  </section>
</main>

<div id="settingsModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="settingsTitle" hidden>
  <div class="modal-backdrop"></div>
  <div class="modal-card">
    <div class="modal-head">
      <h3 id="settingsTitle" data-i18n="settings.title"></h3>
      <button id="btnCloseSettings" class="modal-close" data-i18n-aria="settings.close">✕</button>
    </div>
    <div class="grid">
      <label class="field"><span data-i18n="settings.canvas_url"></span><input id="canvasUrl" type="text" placeholder="https://canvas.cityu.edu.hk"></label>
      <label class="field"><span data-i18n="settings.canvas_token"></span><input id="canvasToken" type="password" placeholder="…"></label>
      <label class="field"><span data-i18n="settings.llm_base"></span><input id="llmBaseUrl" type="text" placeholder="https://api.deepseek.com/v1"></label>
      <label class="field"><span data-i18n="settings.llm_key"></span><input id="llmApiKey" type="password" placeholder="sk-…"></label>
      <label class="field"><span data-i18n="settings.llm_model"></span><input id="llmModel" type="text" placeholder="deepseek-chat"></label>
      <div class="field"><span data-i18n="settings.download_dir"></span>
        <div class="row" style="gap:8px">
          <input id="downloadDir" type="text" placeholder="~/Downloads/Canvas课程文件" style="flex:1">
          <button id="btnBrowseDir" type="button" class="btn btn-ghost" data-i18n="settings.browse_dir"></button>
        </div>
      </div>
    </div>
    <div style="margin-top:20px">
      <span class="eyebrow" data-i18n="settings.aims_heading"></span>
      <div class="grid">
        <label class="field"><span data-i18n="settings.aims_user"></span><input id="aimsUsername" type="text" autocomplete="username" placeholder="CityUHK EID"></label>
        <label class="field"><span data-i18n="settings.aims_pass"></span><input id="aimsPassword" type="password" autocomplete="current-password" placeholder="••••••••"></label>
      </div>
      <div class="row" style="margin-top:10px">
        <button id="btnSaveAims" class="btn btn-primary" data-i18n="btn.save_auto_login"></button>
        <button id="btnClearAims" class="btn btn-ghost" data-i18n="btn.clear_aims" hidden></button>
        <span id="aimsSavedHint" class="muted"></span>
      </div>
    </div>
    <div class="row" style="margin-top:16px">
      <button id="btnTest" class="btn btn-primary" data-i18n="btn.test"></button>
      <label class="field"><span data-i18n="settings.calendar"></span><select id="selCalendar"></select></label>
      <label class="field"><span data-i18n="settings.list"></span><select id="selList"></select></label>
      <button id="btnLoadCalendars" class="btn btn-ghost" data-i18n="btn.refresh_calendars"></button>
    </div>
  </div>
</div>

<div id="detailModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="detailTitle" hidden>
  <div class="modal-backdrop"></div>
  <div class="modal-card modal-lg">
    <div class="modal-head">
      <h3 id="detailTitle" data-i18n="detail.title"></h3>
      <button id="btnCloseDetail" class="modal-close" data-i18n-aria="detail.close">✕</button>
    </div>
    <div id="detailBody"></div>
  </div>
</div>

<div id="status" class="banner" role="status"></div>
<div id="overlay">
  <div class="overlay-card">
    <div class="spinner"></div>
    <div id="overlayText"></div>
  </div>
</div>

<script src="/static/i18n.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
