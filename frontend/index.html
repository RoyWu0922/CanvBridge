<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Canvas 课程助手</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header class="app-header">
  <div class="app-title">📚 Canvas 课程助手</div>
  <div class="header-right">
    <div class="range-pill" id="rangePill">请选择起止日期</div>
    <button id="btnSettings" class="icon-btn" title="设置" aria-label="打开设置">⚙️</button>
  </div>
</header>

<main>
  <section class="card">
    <div class="card-head">
      <span class="eyebrow">时间范围</span>
      <h2>同步公告并总结</h2>
    </div>
    <div class="row">
      <label class="field">开始日期<input id="inpStart" type="date"></label>
      <label class="field">结束日期<input id="inpEnd" type="date"></label>
      <button id="btnLoadCourses" class="btn btn-ghost">📂 加载课程</button>
      <button id="btnSync" class="btn btn-primary">✨ 同步并总结</button>
    </div>
    <div id="courseCheckboxes" class="chips"></div>
  </section>

  <section class="card">
    <div class="tabs" role="tablist">
      <button class="tab active" data-target="tabAnnounce" role="tab" aria-selected="true">📄 公告总结</button>
      <button class="tab" data-target="tabFiles" role="tab" aria-selected="false">🗂 课程文件</button>
      <button class="tab" data-target="tabSchedule" role="tab" aria-selected="false">🗓 课表</button>
    </div>

    <div id="tabAnnounce" class="tab-panel" role="tabpanel">
      <div class="filter-bar">
        <span class="filter-label">事件筛选</span>
        <label class="check"><input type="checkbox" id="chkShowAll"> 显示全部公告内事件</label>
        <label class="field">从<input id="filterStart" type="date"></label>
        <label class="field">到<input id="filterEnd" type="date"></label>
      </div>
      <div id="summaries"></div>
      <div class="write-bar">
        <button id="btnWriteCalendar" class="btn btn-accent">📅 写入选中的日历事件</button>
        <label class="field">提前提醒<select id="selAlert"></select></label>
        <button id="btnWriteReminders" class="btn btn-accent">✅ 写入选中的提醒</button>
      </div>
    </div>

    <div id="tabFiles" class="tab-panel" role="tabpanel" hidden>
      <div class="row">
        <button id="btnListFiles" class="btn btn-primary">🗂 加载文件列表</button>
        <label class="field">类型过滤<input id="inpTypeFilter" type="text" placeholder="pdf, pptx…（留空=全部）"></label>
        <button id="btnSelectAllFiles" class="btn btn-ghost">全选</button>
        <button id="btnDownloadFiles" class="btn btn-primary">⬇ 下载所选</button>
      </div>
      <div id="filesArea" class="muted" style="margin-top:14px"></div>
    </div>

    <div id="tabSchedule" class="tab-panel" role="tabpanel" hidden>
      <div class="filter-bar" id="banwebStatus">
        <span class="filter-label">AIMS 登录</span>
        <span id="banwebStatusText" class="muted">检测中…</span>
        <button id="btnBanwebLogin" class="btn btn-primary" hidden>🔑 重新登录</button>
      </div>
      <div class="row" style="margin-bottom:16px">
        <label class="field">学期<select id="selTerm"></select></label>
        <button id="btnFetchSchedule" class="btn btn-primary">🔍 抓取课表</button>
      </div>
      <div id="schedulePreview"></div>
      <div class="write-bar">
        <label class="field">写入日历<select id="selSchedCalendar"></select></label>
        <label class="field">提前提醒<select id="selSchedAlert"></select></label>
        <button id="btnWriteSchedule" class="btn btn-accent">📅 同步课表</button>
        <button id="btnClearSchedule" class="btn btn-ghost">清除预览</button>
      </div>
    </div>
  </section>
</main>

<div id="settingsModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="settingsTitle" hidden>
  <div class="modal-backdrop"></div>
  <div class="modal-card">
    <div class="modal-head">
      <h3 id="settingsTitle">设置</h3>
      <button id="btnCloseSettings" class="modal-close" aria-label="关闭设置">✕</button>
    </div>
    <div class="grid">
      <label class="field">Canvas 实例 URL<input id="canvasUrl" type="text" placeholder="https://canvas.cityu.edu.hk"></label>
      <label class="field">Canvas API Token<input id="canvasToken" type="password" placeholder="…"></label>
      <label class="field">LLM Base URL<input id="llmBaseUrl" type="text" placeholder="https://api.deepseek.com/v1"></label>
      <label class="field">LLM API Key<input id="llmApiKey" type="password" placeholder="sk-…"></label>
      <label class="field">LLM 模型名<input id="llmModel" type="text" placeholder="deepseek-chat"></label>
      <label class="field">下载目录<input id="downloadDir" type="text" placeholder="~/Downloads/Canvas课程文件"></label>
    </div>
    <div class="row" style="margin-top:16px">
      <button id="btnTest" class="btn btn-primary">🔌 测试连接</button>
      <label class="field">写入日历<select id="selCalendar"></select></label>
      <label class="field">写入提醒列表<select id="selList"></select></label>
      <button id="btnLoadCalendars" class="btn btn-ghost">刷新日历/列表</button>
    </div>
  </div>
</div>

<div id="status" class="banner" role="status"></div>
<div id="overlay">
  <div class="overlay-card">
    <div class="spinner"></div>
    <div id="overlayText">处理中…</div>
  </div>
</div>

<script src="/static/i18n.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
