<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Canvas 课程助手</title>
<link rel="stylesheet" href="/static/app.css">
<script>
  // 主题预解析：首次绘制前设 <html data-theme>，避免跟随系统时先闪一遍浅色。
  // sc_theme: "light" | "dark" | "system"（缺省=dark）。真正的持久化/监听由 app.js 做。
  (function () {
    try {
      var mode = localStorage.getItem("sc_theme") || "dark";
      var dark = mode === "dark" || (mode === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.dataset.theme = dark ? "dark" : "light";
    } catch (e) {
      document.documentElement.dataset.theme = "dark";
    }
  })();
</script>
</head>
<body>
<div class="app-shell">

  <aside class="sidebar">
    <div class="sidebar-logo">
      <span class="logo-mark">🎓</span>
      <span class="logo-text" data-i18n="app.title"></span>
    </div>
    <nav class="nav" id="nav">
      <button class="nav-item" data-page="home"><span data-i18n="nav.home"></span></button>
      <button class="nav-item" data-page="announce"><span data-i18n="nav.announce"></span></button>
      <button class="nav-item" data-page="discuss"><span data-i18n="nav.discuss"></span></button>
      <button class="nav-item" data-page="schedule"><span data-i18n="nav.schedule"></span></button>
      <button class="nav-item" data-page="todo"><span data-i18n="nav.todo"></span></button>
      <button class="nav-item" data-page="files"><span data-i18n="nav.files"></span></button>
      <button class="nav-item" data-page="grades"><span data-i18n="nav.grades"></span></button>
      <button class="nav-item" data-page="courses"><span data-i18n="nav.courses"></span></button>
      <div class="nav-gap"></div>
      <button class="nav-item" data-page="settings"><span data-i18n="nav.settings"></span></button>
    </nav>
  </aside>

  <main class="content">
    <div id="page-home" class="page" hidden>
      <div class="page-head"><h2 data-i18n="nav.home"></h2></div>

      <div id="homeNeedCanvas" class="glass-card home-guide" hidden>
        <p data-i18n="home.need_canvas"></p>
        <button class="btn btn-primary" data-goto="settings" data-i18n="nav.settings"></button>
      </div>

      <div id="homeStats" class="stat-row">
        <div class="glass-card stat-card" data-goto="announce">
          <b id="statAnnounce">—</b><span data-i18n="home.stat.announce"></span></div>
        <div class="glass-card stat-card" data-goto="schedule">
          <b id="statToday">—</b><span data-i18n="home.stat.today"></span></div>
        <div class="glass-card stat-card" data-goto="todo">
          <b id="statDdl">—</b><span data-i18n="home.stat.ddl"></span></div>
        <div class="glass-card stat-card" data-goto="schedule">
          <b id="statExam">—</b><span data-i18n="home.stat.exam"></span></div>
      </div>

      <div class="glass-card list-card">
        <div class="list-head"><span data-i18n="home.today_schedule"></span>
          <button class="link-btn" data-goto="schedule" data-i18n="home.more"></button></div>
        <div id="homeTodayList" class="today-grid"></div>
      </div>

      <div class="home-cards">
        <div class="glass-card list-card">
          <div class="list-head"><span data-i18n="home.recent_announce"></span>
            <button class="link-btn" data-goto="announce" data-i18n="home.more"></button></div>
          <div id="homeAnnounceList" class="muted" data-i18n="home.loading"></div>
        </div>

        <div class="glass-card list-card">
          <div class="list-head"><span data-i18n="home.ddl_card"></span>
            <button class="link-btn" data-goto="todo" data-i18n="home.more"></button></div>
          <div id="homeDdlList" class="muted" data-i18n="home.loading"></div>
        </div>

        <div class="glass-card list-card">
          <div class="list-head"><span data-i18n="home.grade_card"></span>
            <button class="link-btn" data-goto="grades" data-i18n="home.more"></button></div>
          <div id="homeGradeList" class="muted" data-i18n="home.loading"></div>
        </div>
      </div>
    </div>

    <div id="page-announce" class="page">
      <div class="filter-bar">
        <label class="field"><span data-i18n="announce.filter.course"></span><select id="selAnnounceCourse"></select></label>
      </div>
      <div id="summaries"></div>
      <div class="write-bar">
        <button id="btnWriteCalendar" class="btn btn-accent" data-i18n="btn.write_calendar"></button>
        <label class="field"><span data-i18n="announce.alert"></span><select id="selAlert"></select></label>
        <button id="btnWriteReminders" class="btn btn-accent" data-i18n="btn.write_reminders"></button>
      </div>
    </div>

    <div id="page-discuss" class="page" hidden>
      <div class="page-head"><h2 data-i18n="nav.discuss"></h2></div>
      <div class="filter-bar">
        <span class="filter-label" data-i18n="discuss.filter_label"></span>
        <button id="btnReloadDiscuss" class="btn btn-ghost" data-i18n="discuss.reload"></button>
        <span id="discussStatus" class="muted"></span>
      </div>
      <div id="discussGroups"></div>
    </div>

    <div id="page-schedule" class="page" hidden>
      <div class="filter-bar" id="banwebStatus">
        <span class="filter-label" data-i18n="schedule.login_label"></span>
        <span id="banwebStatusText" class="muted"></span>
        <button id="btnBanwebLogin" class="btn btn-primary" hidden data-i18n="btn.relogin"></button>
      </div>
      <div class="row" style="margin-bottom:16px">
        <label class="field"><span data-i18n="schedule.term"></span><select id="selTerm"></select></label>
        <button id="btnFetchSchedule" class="btn btn-primary" data-i18n="btn.fetch"></button>
      </div>
      <div class="filter-bar" id="scheduleFilters" style="margin-top:-4px">
        <button id="btnLoadAssignments" class="btn btn-ghost" data-i18n="btn.load_assignments"></button>
        <label class="field"><span data-i18n="schedule.professor"></span><select id="selProfessor"></select></label>
      </div>
      <div class="week-nav" id="weekNav">
        <button id="btnWeekPrev" class="btn btn-ghost" data-i18n-aria="week.prev" aria-label="上一周">◀</button>
        <span id="weekRange" class="week-range"></span>
        <button id="btnWeekNext" class="btn btn-ghost" data-i18n-aria="week.next" aria-label="下一周">▶</button>
        <button id="btnWeekToday" class="btn btn-ghost" data-i18n="week.today"></button>
      </div>
      <div id="schedulePreview"></div>
      <div id="scheduleNoFixed"></div>
      <div class="filter-bar" id="examBar" style="margin-top:14px">
        <span class="filter-label" data-i18n="schedule.exam_label"></span>
        <button id="btnReloadExams" class="btn btn-ghost" data-i18n="schedule.exam_reload"></button>
        <span id="examStatus" class="muted"></span>
        <span style="flex:1"></span>
        <label class="field"><span data-i18n="schedule.calendar"></span><select id="selExamCalendar"></select></label>
        <button id="btnWriteExams" class="btn btn-accent" data-i18n="schedule.write_exams"></button>
      </div>
      <div id="quizGroup" hidden></div>
      <div class="write-bar">
        <label class="field"><span data-i18n="schedule.calendar"></span><select id="selSchedCalendar"></select></label>
        <label class="field"><span data-i18n="schedule.alert"></span><select id="selSchedAlert"></select></label>
        <button id="btnWriteSchedule" class="btn btn-accent" data-i18n="btn.sync_schedule"></button>
        <button id="btnClearSchedule" class="btn btn-ghost" data-i18n="btn.clear"></button>
      </div>
    </div>

    <div id="page-todo" class="page" hidden>
      <div class="filter-bar" id="todoStatus">
        <span class="filter-label" data-i18n="todo.groups_label"></span>
        <button id="btnLoadTodo" class="btn btn-primary" data-i18n="btn.load_todo"></button>
      </div>
      <div id="todoGroups"></div>
      <div class="sub-label" style="margin-top:18px" data-i18n="todo.events_heading"></div>
      <div id="todoEvents" class="muted" style="margin-top:4px"></div>
      <div class="write-bar">
        <label class="field"><span data-i18n="schedule.calendar"></span><select id="selTodoCalendar"></select></label>
        <label class="field"><span data-i18n="schedule.alert"></span><select id="selTodoAlert"></select></label>
        <button id="btnWriteTodoEvents" class="btn btn-accent" data-i18n="todo.write_events"></button>
      </div>
    </div>

    <div id="page-files" class="page" hidden>
      <div class="row">
        <button id="btnListFiles" class="btn btn-primary" data-i18n="btn.list_files"></button>
        <label class="field"><span data-i18n="files.type_filter"></span><input id="inpTypeFilter" type="text" data-i18n-ph="files.placeholder"></label>
        <label class="field"><span data-i18n="files.filter.course"></span><select id="selFileCourse"></select></label>
        <button id="btnSelectAllFiles" class="btn btn-ghost" data-i18n="btn.select_all"></button>
        <button id="btnDownloadFiles" class="btn btn-primary" data-i18n="btn.download"></button>
      </div>
      <div id="downloadProgress" class="download-progress" hidden>
        <div class="progress-track"><div class="progress-fill" id="downloadProgressFill"></div></div>
        <div class="progress-text" id="downloadProgressText"></div>
      </div>
      <div id="filesArea" class="muted" style="margin-top:14px"></div>
    </div>

    <div id="page-grades" class="page" hidden>
      <div class="filter-bar" id="gradesStatus">
        <span class="filter-label" data-i18n="grades.label"></span>
        <button id="btnLoadGrades" class="btn btn-primary" data-i18n="btn.load_grades"></button>
      </div>
      <div id="gradesArea"></div>
    </div>

    <div id="page-courses" class="page" hidden>
      <!-- 课程中心：列表视图 ↔ 单课程详情视图，同一时刻只显示其一。
           与课程详情弹层 #detailModal 并存，两者互不替代。 -->

      <div id="hubList">
        <div class="page-head"><h2 data-i18n="nav.courses"></h2></div>
        <div id="hubListArea"></div>
      </div>

      <div id="hubDetail" hidden>
        <div class="page-head">
          <button id="btnHubBack" class="btn btn-ghost" data-i18n="hub.back"></button>
          <h2 id="hubTitle"></h2>
          <span class="sp"></span>
        </div>
        <div id="hubTabs" class="tab-bar" role="tablist">
          <button class="tab-item" role="tab" data-tab="files" data-i18n="tab.files"></button>
          <button class="tab-item" role="tab" data-tab="announce" data-i18n="tab.announce"></button>
          <button class="tab-item" role="tab" data-tab="todo" data-i18n="tab.todo"></button>
          <button class="tab-item" role="tab" data-tab="discuss" data-i18n="tab.discuss"></button>
        </div>
        <div id="hubPanel"></div>
      </div>
    </div>

    <div id="page-settings" class="page" hidden>
      <div class="set-grid">

        <section class="set-card">
          <span class="eyebrow" data-i18n="settings.group.appearance"></span>
          <div class="grid">
            <label class="field"><span data-i18n="settings.theme"></span><select id="selTheme">
              <option value="system" data-i18n="settings.theme_system"></option>
              <option value="light" data-i18n="settings.theme_light"></option>
              <option value="dark" data-i18n="settings.theme_dark"></option>
            </select></label>
            <div class="field"><span data-i18n="settings.language"></span>
              <button id="btnLang" class="lang-btn" data-i18n-aria="lang.switch"></button>
            </div>
          </div>
        </section>

        <section class="set-card">
          <span class="eyebrow" data-i18n="settings.group.canvas"></span>
          <div class="grid">
            <label class="field"><span data-i18n="settings.canvas_url"></span><input id="canvasUrl" type="text" placeholder="https://canvas.cityu.edu.hk"></label>
            <label class="field"><span data-i18n="settings.canvas_token"></span><input id="canvasToken" type="password" placeholder="…"></label>
          </div>
          <div class="row" style="margin-top:12px">
            <button id="btnTest" class="btn btn-primary" data-i18n="btn.test"></button>
          </div>
        </section>

        <section class="set-card">
          <span class="eyebrow" data-i18n="settings.group.aims"></span>
          <div class="grid">
            <label class="field"><span data-i18n="settings.aims_user"></span><input id="aimsUsername" type="text" autocomplete="username" placeholder="CityUHK EID"></label>
            <label class="field"><span data-i18n="settings.aims_pass"></span><input id="aimsPassword" type="password" autocomplete="current-password" placeholder="••••••••"></label>
          </div>
          <div class="row" style="margin-top:10px">
            <button id="btnSaveAims" class="btn btn-primary" data-i18n="btn.save_auto_login"></button>
            <button id="btnClearAims" class="btn btn-ghost" data-i18n="btn.clear_aims" hidden></button>
            <span id="aimsSavedHint" class="muted"></span>
          </div>
        </section>

        <section class="set-card">
          <span class="eyebrow" data-i18n="settings.group.download"></span>
          <div class="field"><span data-i18n="settings.download_dir"></span>
            <div class="row" style="gap:8px">
              <input id="downloadDir" type="text" placeholder="~/Downloads/Canvas课程文件" style="flex:1">
              <button id="btnBrowseDir" type="button" class="btn btn-ghost" data-i18n="settings.browse_dir"></button>
            </div>
          </div>
        </section>

        <section class="set-card">
          <span class="eyebrow" data-i18n="settings.group.calendar"></span>
          <div class="grid">
            <label class="field"><span data-i18n="settings.calendar"></span><select id="selCalendar"></select></label>
            <label class="field"><span data-i18n="settings.list"></span><select id="selList"></select></label>
          </div>
          <div class="row" style="margin-top:12px">
            <button id="btnLoadCalendars" class="btn btn-ghost" data-i18n="btn.refresh_calendars"></button>
          </div>
        </section>

        <section class="set-card">
          <span class="eyebrow" data-i18n="settings.group.llm"></span>
          <div class="grid">
            <label class="field"><span data-i18n="settings.llm_base"></span><input id="llmBaseUrl" type="text" placeholder="https://api.deepseek.com/v1"></label>
            <label class="field"><span data-i18n="settings.llm_key"></span><input id="llmApiKey" type="password" placeholder="sk-…"></label>
            <label class="field"><span data-i18n="settings.llm_model"></span><input id="llmModel" type="text" placeholder="deepseek-chat"></label>
          </div>
        </section>

        <section class="set-card set-wide">
          <span class="eyebrow" data-i18n="settings.group.course"></span>
          <div class="row" style="margin-bottom:12px">
            <button id="btnLoadCourses" class="btn btn-primary" data-i18n="btn.load_courses"></button>
            <span class="sp"></span>
            <span class="muted" data-i18n="courses.hint_selected"></span>
          </div>
          <div class="range-row">
            <label class="field"><span data-i18n="courses.range_label"></span></label>
            <input id="inpStart" type="date">
            <span class="range-dash">–</span>
            <input id="inpEnd" type="date">
          </div>
          <!-- 原有课程勾选容器：id 不变，renderCourseCheckboxes() 直接往里写 -->
          <div id="courseCheckboxes" class="course-list"></div>
          <hr class="set-sep">
          <div class="sub-label" data-i18n="settings.ignore_heading"></div>
          <div id="ignoreCourses" class="chips" style="margin-bottom:6px"></div>
          <div class="row" style="gap:10px;flex-wrap:wrap">
            <button id="btnClearIgnore" class="btn btn-ghost" data-i18n="settings.clear_ignore"></button>
            <span class="muted" data-i18n="settings.ignore_hint"></span>
          </div>
        </section>

      </div>
    </div>
  </main>

</div>

<div id="detailModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="detailTitle" hidden>
  <div class="modal-backdrop"></div>
  <div class="modal-card modal-lg">
    <div class="modal-head">
      <h3 id="detailTitle" data-i18n="detail.title"></h3>
      <button id="btnCloseDetail" class="modal-close" data-i18n-aria="detail.close">✕</button>
    </div>
    <div id="detailBody"></div>
    <div class="write-bar" id="detailWriteBar" hidden>
      <label class="field"><span data-i18n="schedule.calendar"></span><select id="selDetailCal"></select></label>
      <label class="field"><span data-i18n="schedule.alert"></span><select id="selDetailAlert"></select></label>
      <button id="btnDetailWriteCalendar" class="btn btn-accent" data-i18n="btn.write_calendar"></button>
      <label class="field"><span data-i18n="settings.list"></span><select id="selDetailList"></select></label>
      <button id="btnDetailWriteReminders" class="btn btn-accent" data-i18n="btn.write_reminders"></button>
    </div>
  </div>
</div>

<div id="modulePop" class="module-pop" role="dialog" aria-modal="false" hidden>
  <div id="modulePopTitle" class="module-pop-title"></div>
  <div class="module-pop-actions">
    <button id="btnModuleOpenFile" class="btn btn-accent" data-i18n="module.open_file"></button>
    <button id="btnModuleOpenPage" class="btn btn-ghost" data-i18n="module.open_page"></button>
  </div>
</div>

<div id="status" class="banner" role="status"></div>
<div id="overlay">
  <div class="overlay-card">
    <div class="spinner"></div>
    <div id="overlayText"></div>
  </div>
</div>

<script src="/static/i18n.js"></script>
<script src="/static/util.js"></script>
<script src="/static/app.js"></script>
<script src="/static/shell.js"></script>
</body>
</html>
