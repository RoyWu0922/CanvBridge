<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2F3542"/>
      <stop offset="0.5" stop-color="#1C202B"/>
      <stop offset="1" stop-color="#0D0F16"/>
    </linearGradient>
    <linearGradient id="rowBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5B8BFF"/>
      <stop offset="1" stop-color="#3D6BF0"/>
    </linearGradient>
    <linearGradient id="rowOrange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFB04A"/>
      <stop offset="1" stop-color="#FF9425"/>
    </linearGradient>
    <linearGradient id="rowGreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#46D981"/>
      <stop offset="1" stop-color="#21BC62"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="20" stdDeviation="28" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- 底：macOS 风格大圆角渐变色块（squircle 近似） -->
  <rect width="1024" height="1024" rx="230" fill="url(#bg)"/>

  <!-- 白色日历卡 -->
  <g filter="url(#cardShadow)">
    <rect x="232" y="196" width="560" height="620" rx="92" fill="#FFFFFF"/>
  </g>

  <!-- 卡内顶部：三颗装饰点 -->
  <circle cx="292" cy="256" r="10" fill="#D9E0EF"/>
  <circle cx="322" cy="256" r="10" fill="#D9E0EF"/>
  <circle cx="352" cy="256" r="10" fill="#D9E0EF"/>

  <!-- 卡内：三行多彩「课程/事件」，长度递增、左对齐 -->
  <rect x="288" y="316" width="230" height="72" rx="36" fill="url(#rowBlue)"/>
  <rect x="288" y="424" width="330" height="72" rx="36" fill="url(#rowOrange)"/>
  <rect x="288" y="532" width="462" height="72" rx="36" fill="url(#rowGreen)"/>

  <!-- 卡内底部：浅色「待定」行 -->
  <rect x="288" y="652" width="300" height="72" rx="36" fill="#EEF1F8"/>

  <!-- 卡右上：红色「今天/写入」圆环，压卡上缘 -->
  <circle cx="760" cy="300" r="62" fill="none" stroke="#FF3B30" stroke-width="26"/>
</svg>
